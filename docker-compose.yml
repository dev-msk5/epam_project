services:
  app:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONPATH=/app/src
      - DB_USER=${DB_USER}                 # app needs these to connect to db
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    ports:
      - "8000:8000"
    volumes:
      - .:/app        # mirrors local folder into the container
      - ./logs:/app/logs  # host:container, maps local ./logs to /app/logs inside container
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]   # use actual user, containers own env
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s            # start period on first boot

volumes:
  pgdata: