services:
  app:
    build:
      context: .
    # For EC2 production: remove "--reload" as it degrades performance
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONPATH=/app/src
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # MINIMAL ADDITIONS FOR SSM
      - USE_SSM=${USE_SSM:-false}               # Toggles SSM (defaults to false locally)
      - AWS_REGION=${AWS_REGION:-us-east-1}     # Tells boto3 which region to query
      - SSM_PATH=/project-dashboard/prod/       # Path namespace in SSM Parameter Store
    ports:
      - "8000:8000"
    # On EC2 production, you should comment out the " - .:/app" volume 
    # to use the baked Docker image layers instead of syncing your SSH folder.
    volumes:
      - .:/app        
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata: