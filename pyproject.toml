[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-dashboard"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    # --- Web Framework ---
    "fastapi[standard]",
    
    # --- Database ---
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",

    # --- Config ---
    "pydantic-settings",

    # --- Auth & Security ---
    "pyjwt[crypto]",
    "pwdlib[argon2]",

    # --- AWS ---
    "boto3",
]

[project.optional-dependencies]
dev = [
    # --- Testing ---
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pytest-cov",

    # --- Code Quality ---
    "ruff",
    "mypy",

    # --- Type Stubs ---
    "boto3-stubs[s3]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]